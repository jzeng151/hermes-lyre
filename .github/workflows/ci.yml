name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Hermes v0.23.0 release commit. Bump together with requires_hermes in lyre/plugin.yaml.
  HERMES_COMMIT: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest

  hermes-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Hermes v0.23.0
        run: |
          set -euo pipefail
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            | bash -s -- --commit "$HERMES_COMMIT" --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Hermes version
        run: hermes --version

      - name: hermes plugins validate
        run: hermes plugins validate lyre --install-deps

      - name: hermes plugins doctor
        run: hermes plugins doctor lyre --ci

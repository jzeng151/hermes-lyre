# Development tooling only. The plugin itself (lyre/) has no dependencies and no
# pyproject of its own, so Hermes installs nothing for it.
[project]
name = "lyre-dev"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
